version: 2
updates:
  # Paquetes NuGet (MySqlConnector y las dependencias de las pruebas).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Acciones del propio workflow de CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
