name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restaurar paquetes
        run: msbuild CRUD-WCF-ASP.Net-CSharp.sln -t:Restore

      - name: Compilar
        run: msbuild CRUD-WCF-ASP.Net-CSharp.sln -t:Build -p:Configuration=Release

  unit-tests:
    runs-on: windows-latest
    # Encadenado a la compilación para no correr en paralelo con ella: si la
    # solución no compila, no tiene sentido gastar un runner en las pruebas.
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      # Se compila solo el proyecto de pruebas unitarias: arrastra Utilities y
      # Model, que es todo lo que necesita. No toca el proyecto web ni Data.
      - name: Restaurar paquetes
        run: msbuild tests/Notes.UnitTests/Notes.UnitTests.csproj -t:Restore

      - name: Compilar las pruebas unitarias
        run: msbuild tests/Notes.UnitTests/Notes.UnitTests.csproj -t:Build -p:Configuration=Release

      - name: Ejecutar las pruebas unitarias
        run: dotnet test tests/Notes.UnitTests/Notes.UnitTests.csproj --no-build -c Release

  # NOTA: las pruebas de integración (tests/Notes.IntegrationTests) NO se corren
  # en CI. Usan Testcontainers, que necesita Docker en modo contenedores Linux;
  # los runners Windows de GitHub corren Docker en modo Windows containers y no
  # pueden bajar la imagen Linux mysql:8.4. Tampoco pueden correrse en un runner
  # Linux porque el proyecto de test es net472 (solo Windows).
  #
  # Por eso el job unit-tests de arriba cubre solo lógica pura (sin Docker ni base
  # de datos). Las de integración se ejecutan en local, donde sí hay Docker-Linux:
  #   msbuild CRUD-WCF-ASP.Net-CSharp.sln -t:Build -p:Configuration=Release
  #   dotnet vstest tests/Notes.IntegrationTests/bin/Release/net472/Notes.IntegrationTests.dll

  dependency-audit:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Audita los paquetes NuGet del proyecto de datos (el que trae dependencias
      # de terceros) contra las advertencias de seguridad conocidas.
      - name: Restaurar
        run: dotnet restore Data/Data.csproj

      - name: Auditar dependencias vulnerables
        shell: pwsh
        run: |
          $out = dotnet list Data/Data.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') {
            Write-Error 'Se encontraron paquetes con vulnerabilidades conocidas.'
            exit 1
          }
